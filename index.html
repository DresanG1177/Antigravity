<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDREW TRADES | Bio Links</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-premium">
    <video class="bg-layer" id="bg-video-a" muted loop playsinline autoplay>
        <source src="background_video.mp4" type="video/mp4">
    </video>
    <video class="bg-layer" id="bg-video-b" muted loop playsinline autoplay>
        <source src="background_video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="warp-flash"></div>

    <section id="gate">
        <p class="gate-question">Are you ready for the<br><span class="gate-emphasis">E-MONEY</span>?</p>
        <button id="gate-btn" type="button">I'M READY</button>
    </section>

    <div class="container" id="main-content">
        <header>
            <div class="profile-container">
                <img src="logo_andrew_blue.png" alt="Andrew Trades Logo" class="brand-logo">
                <h1>ANDREW TRADES</h1>
                <p class="bio">Money is a tool. Freedom is the goal.</p>
            </div>
        </header>

        <main id="links-container">

        <a href="https://discord.gg/FM3Ue4aj" class="link-card" target="_blank">
            <img src="icon_discord.svg" alt="Discord" class="link-icon">
            <span class="link-text">Discord Free</span>
        </a>

        <a href="https://whop.com/premiumandrew/" class="link-card" target="_blank">
            <img src="icon_whop.png" alt="Whop" class="link-icon link-icon-square">
            <span class="link-text">Whop Premium</span>
        </a>

        <a href="https://www.youtube.com/@Andresw_trades" class="link-card" target="_blank">
            <img src="icon_youtube.svg" alt="YouTube" class="link-icon">
            <span class="link-text">YouTube</span>
        </a>

        </main>

        <footer>
            <p>© 2026 Crafted by Antigravity</p>
        </footer>
    </div>
    <script src="bg-video-loop.js"></script>
    <script src="gate.js"></script>
</body>
</html>
